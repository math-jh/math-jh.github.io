# 기호 찾아보기 데이터 — /ko/notations 가 Liquid 로 조판한다.
# 생성: notation-index-sweep workflow (2026-07-24) + build_notations.py v2 결정론 조립.
# 항목: category(폴더 슬러그)/title/conventions[]/items[] — 각 행 {symbol(KaTeX, $ 없이)·
#       meaning(terms.yml primary 우선)·defs[{label("§글제목"),url}]}. 카테고리 순서는
#       _data/categories.yml subjects 순서. 수동 편집 가능 — 재생성 시 병합 주의.
- category: calculus
  title: 미적분학
  items:
