# 카테고리 마스터 파일 — 목록·순서·섹션·표시명·색을 여기 한 곳에서 관리한다.
#
# sections : 홈 그리드와 사이드바의 큰 묶음. 키는 슬러그.
#            ko/en   언어별 표시명
#            family  의존성 그래프의 굵은 묶음(필터 칩). foundations/algebra/
#                    analysis/geometry/misc 중 하나 — Graph_page.js 의 FAMILIES 와 맞출 것.
#                    family 가 misc 인 노드는 그래프에서 채도 0(회색)으로 그려진다.
# subjects : 카테고리. 키는 글의 `categories:` 문자열과 정확히 같아야 한다.
#            ko      한국어 표시명 (영어 아카이브는 " / " 앞을 떼어 쓴다)
#            section 위 sections 의 키
#            hue/sat/l  그 과목의 색 — hero 그라디언트·/categories 마름모와 밑줄·
#                       홈 타일·의존성 그래프 노드가 모두 이 값을 쓴다.
#
# **subjects 의 키 순서가 곧 표시 순서**다 (YAML 매핑은 삽입 순서를 보존한다).
# 섹션의 순서·구성도 여기서 파생한다 — _plugins/hide_empty_subject_pages.rb 가
# site.data.home_sections 를 만들어 준다. 예전엔 과목 목록이 _data/home_sections.yml
# 에 한 벌 더 있었고, 그게 어긋나 정수론·해석학 카드가 홈에서 통째로 빠져 있었다.
#
# 쓰이는 곳: /ko/categories/·/en/categories/ · 홈 과목 카드 · category-* 사이드바 ·
#            과목홈 hero·eyebrow · 홈 타일 번호(scripts/generate-thumbnails.js) ·
#            의존성 그래프 노드 색(_plugins/graph_data.rb)
#
# 빈 카테고리: 글이 하나도 없는 카테고리는 그냥 여기 남겨 둬도 된다. 카테고리 목록
# 페이지·과목홈·홈 카드·사이드바에서 모두 자동으로 빠진다. published: false 초안만
# 있는 카테고리는 로컬 프리뷰(--unpublished)에서만 보인다.
#
# 색 팔레트(패밀리별 hue 정체성, 밝기 l 로 과목 구분):
#   교양수학+수학기초론 → violet(~256) · 대수학+정수론 → blue(~216)
#   해석학 → teal(~188) · 기하학(위상·미분·대수·거울대칭) → warm band(8–48)
#   Misc → 무채색

sections:
  liberal_arts:           { ko: "교양수학", en: "Liberal Arts", family: foundations }
  foundations:            { ko: "수학기초론", en: "Foundations", family: foundations }
  algebra:                { ko: "대수학", en: "Algebra", family: algebra }
  number_theory:          { ko: "정수론", en: "Number Theory", family: algebra }
  analysis:               { ko: "해석학", en: "Analysis", family: analysis }
  topology:               { ko: "위상수학", en: "Topology", family: geometry }
  differential_geometry:  { ko: "미분기하학", en: "Differential Geometry", family: geometry }
  algebraic_geometry:     { ko: "대수기하학", en: "Algebraic Geometry", family: geometry }
  mirror_symmetry:        { ko: "거울대칭", en: "Mirror Symmetry", family: geometry }
  misc:                   { ko: "기타", en: "Misc", family: misc }

subjects:
  # --- 교양수학 ---
  "Math / Calculus":                { ko: "미적분학", section: liberal_arts, hue: 256, sat: "24%", l: 50 }
  "Math / Linear Algebra":          { ko: "선형대수학", section: liberal_arts, hue: 252, sat: "24%", l: 44 }
  # --- 수학기초론 ---
  "Math / Set Theory":              { ko: "집합론", section: foundations, hue: 260, sat: "24%", l: 50 }
  "Math / Category Theory":         { ko: "범주론", section: foundations, hue: 264, sat: "24%", l: 56 }
  # --- 대수학 ---
  "Math / Algebraic Structures":    { ko: "대수적 구조", section: algebra, hue: 210, sat: "24%", l: 38 }
  "Math / Group Theory":            { ko: "군론", section: algebra, hue: 213, sat: "24%", l: 42 }
  "Math / Ring Theory":             { ko: "환론", section: algebra, hue: 216, sat: "24%", l: 46 }
  "Math / Multilinear Algebra":     { ko: "다중선형대수학", section: algebra, hue: 219, sat: "24%", l: 50 }
  "Math / Field Theory":            { ko: "체론", section: algebra, hue: 222, sat: "24%", l: 54 }
  "Math / Homological Algebra":     { ko: "호몰로지 대수학", section: algebra, hue: 225, sat: "24%", l: 44 }
  "Math / Commutative Algebra":     { ko: "가환대수학", section: algebra, hue: 228, sat: "24%", l: 48 }
  "Math / Representation Theory":   { ko: "표현론", section: algebra, hue: 231, sat: "24%", l: 52 }
  # --- 정수론 --- (섹션은 따로 두되 hue 는 대수학 계열을 빌린다: 성격이 대수 쪽)
  "Math / Number Theory":           { ko: "정수론", section: number_theory, hue: 213, sat: "24%", l: 40 }
  # --- 해석학 ---
  "Math / Analysis":                { ko: "해석학", section: analysis, hue: 188, sat: "24%", l: 48 }
  "Math / Complex Analysis":        { ko: "복소해석학", section: analysis, hue: 192, sat: "24%", l: 42 }
  # --- 위상수학 ---
  "Math / Topology":                { ko: "위상수학", section: topology, hue: 8, sat: "28%", l: 46 }
  "Math / Algebraic Topology":      { ko: "대수적 위상수학", section: topology, hue: 12, sat: "28%", l: 50 }
  # --- 미분기하학 ---
  "Math / Manifolds":               { ko: "미분다양체", section: differential_geometry, hue: 16, sat: "28%", l: 44 }
  "Math / Lie Theory":              { ko: "리 이론", section: differential_geometry, hue: 20, sat: "28%", l: 48 }
  "Math / Riemannian Geometry":     { ko: "리만기하학", section: differential_geometry, hue: 24, sat: "28%", l: 52 }
  "Math / Complex Geometry":        { ko: "복소기하학", section: differential_geometry, hue: 26, sat: "28%", l: 48 }
  # --- 대수기하학 ---
  # 여섯 과목을 hue 28..38 (step 2), l 36..56 (step 4) 로 등간격 배치한다.
  # 이웃 섹션이 복소기하학 26 과 거울대칭 40 이라 쓸 수 있는 구간이 (26, 40) 이다.
  "Math / Algebraic Varieties":     { ko: "대수다양체", section: algebraic_geometry, hue: 28, sat: "28%", l: 36 }
  "Math / Scheme Theory":           { ko: "스킴", section: algebraic_geometry, hue: 30, sat: "28%", l: 40 }
  "Math / Toric Geometry":          { ko: "토릭 기하학", section: algebraic_geometry, hue: 32, sat: "28%", l: 44 }
  "Math / Sheaf Theory":            { ko: "층론", section: algebraic_geometry, hue: 34, sat: "28%", l: 48 }
  "Math / Stacks":                  { ko: "스택", section: algebraic_geometry, hue: 36, sat: "28%", l: 52 }
  "Math / Derived Algebraic Geometry": { ko: "유도대수기하학", section: algebraic_geometry, hue: 38, sat: "28%", l: 56 }
  # --- 거울대칭 ---
  "Math / Symplectic Geometry":     { ko: "사교기하학", section: mirror_symmetry, hue: 44, sat: "28%", l: 50 }
  "Math / Gromov-Witten Theory":    { ko: "그로모프-위튼 이론", section: mirror_symmetry, hue: 48, sat: "28%", l: 44 }
  "Math / Mirror Symmetry":         { ko: "거울대칭", section: mirror_symmetry, hue: 40, sat: "28%", l: 46 }
  # --- 기타 ---
  "Misc / Blog Development":        { ko: "블로그 개발", section: misc, hue: 0, sat: "0%", l: 44 }
  "Misc / Peripherals":             { ko: "주변기기", section: misc, hue: 0, sat: "0%", l: 56 }
  "Misc / LLM Workshop":            { ko: "LLM 작업실", section: misc, hue: 0, sat: "0%", l: 50 }
