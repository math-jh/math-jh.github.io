# 브랜드 마크 색 — 단일 출처. 소비처:
#   _includes/head.html          — 파비콘 인라인 SVG(navy·brass), meta theme-color(chrome_dark)
#   _includes/head/custom.html   — safari mask-icon 색(brass)
#   _layouts/default.html        — 다크 스크롤바 트랙(chrome_dark)
#   assets/favicons/site.webmanifest — PWA theme/background(navy; Liquid 처리)
#   _includes/css/brand-vars.scss    — SCSS $brand-* 주입 → skins/_custom.scss
#   scripts/favicons/gen_favicons.py — 래스터 파비콘 생성 (yaml 로 읽음)
# 주의: 색을 바꾸면 gen_favicons.py 재실행(래스터 재생성) +
#       assets/favicons/safari-pinned-tab.svg 는 수동 확인.
navy: &navy "#0a1120"   # 마크 타일 · masthead/footer · PWA theme/background
brass: "#c89441"        # 마크 사각 스트로크 · masthead hover · mask-icon
chrome_dark: *navy      # 브라우저 크롬(meta theme-color) · 다크 스크롤바 트랙 — navy 와 동일(alias)
