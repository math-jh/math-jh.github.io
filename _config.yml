title                    : "Blackbox"
title_separator          : "-"
subtitle                 : # site tagline that appears below site title in masthead
name                     : "K"
description              : "수학쟁이의 낙서장"
description_en           : "Some notes across algebra, geometry, topology, and related fields."
url                      : "https://math-jh.com" # the base hostname & protocol for your site
baseurl                  : # the subpath of your site, e.g. "/blog"
repository               : "math-jh/math-jh.github.io" # GitHub username/repo-name e.g. "mmistakes/minimal-mistakes"
teaser                   : # path of fallback teaser image, e.g. "/assets/images/500x300.png"
logo                     : # path of logo image to display in the masthead, e.g. "/assets/images/88x88.png"
masthead_title           : # overrides the website title displayed in the masthead, use " " for no title
breadcrumbs              : false # true, false (default)
words_per_minute         : 250
comments:
  provider               : "custom"
  custom:
    endpoint             : "https://comments.math-jh.com"
    turnstile_sitekey   : "0x4AAAAAAEeu9iS7h63lBCkn" # public key; secret stays in Worker secrets
  disqus:
    shortname            : "math-jh" # https://help.disqus.com/customer/portal/articles/466208-what-s-a-shortname-
  discourse:
    server               : # https://meta.discourse.org/t/embedding-discourse-comments-via-javascript/31963 , e.g.: meta.discourse.org
  facebook:
    # https://developers.facebook.com/docs/plugins/comments
    appid                :
    num_posts            : # 5 (default)
    colorscheme          : # "light" (default), "dark"
  utterances:
    theme                : # "github-light" (default), "github-dark"
    issue_term           : # "pathname" (default)
# 기계번역 provenance — 새 EN의 번역 엔진, 계속 관리·표시할 과거 엔진,
# 현재 원문대조 폴리싱 패스를 각각 기록한다. 쓰는 곳: translate_worker.py,
# translation-notice.html.
translation_source_tag         : "antigravity-gemini-3.8-flash-high"
translation_source_legacy_tags : ["kimi-cli"]
translation_polish_source_tag  : "antigravity-gemini-3.8-flash-high"
atom_feed:
