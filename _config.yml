# Reading Files
include:
  - .htaccess
  - _pages
  # _main.js 는 언더스코어 시작이라 기본 무시됨 — footer_scripts 직접 서빙에 필요
  - assets/js/_main.js
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - "._*" # macOS AppleDouble 잔재 — SMB 복사 때 생기며, 바이너리를 md 로 읽다 빌드가 죽는다
  - "**/._*"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  # assets/js/plugins·_main.js 는 exclude 하지 않는다 — footer_scripts 가 소스를
  # 직접 서빙한다 (아래 footer_scripts 목록 참고).
  - assets/diagrams
  - assets/js/vendor/jquery/jquery-3.6.0.js
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - tmp
  - scripts
  - workers                             # Cloudflare Worker source; never publish in _site
  - .obsidian
  - .backups
  # 사이트 콘텐츠가 아니지만 jekyll serve 의 watcher 가 감시 대상으로 잡는 경로.
  # Jekyll 은 dotfile 을 빌드하지 않으므로 산출물에는 영향이 없고, 여기 적는 목적은
  # jekyll-watch 가 이 목록을 listen 의 :ignore 로 넘겨 불필요한 전체 재빌드를
  # 막는 것이다 (에이전트 훅이 .pyc 를 쓸 때마다 재빌드가 돌았다).
  - .claude
  - .agents
  - .codex
  - .github
  - .jekyll-cache
  - notes                               # gitignore된 작업 노트. frontmatter가 있어 Jekyll이
                                        # 파싱하려다 YAML 예외를 낸다 (CI엔 존재하지 않음)
  # CI deploy fix (2026-07-03): keep the GitHub Pages site under the 1 GB limit
  # (2026-07-05: keyboard posts re-published with <video> references removed)
  - assets/videos                       # 510 MB of .mov keyboard sound-test clips
keep_files:
  - .git
  - .svn
  - pagefind  # local-only: native pagefind binary writes _site/pagefind/; CI regenerates anyway
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # https://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style
  # Minimal Mistakes (+ its vendored susy/breakpoint libs) is built entirely on
  # Sass @import, which Dart Sass deprecated in favour of @use/@forward (slated for
  # removal in Dart Sass 3.0). Migrating vendored third-party Sass is a large rewrite
  # that also breaks MM's !default skin-override pattern, so silence just this one
  # deprecation category — other deprecations still surface. ~241 warnings/build.
  silence_deprecations:
    - import          # @import rules — whole theme is @import-based
    - slash-div       # `/` as division (susy/breakpoint)
    - if-function     # global if() (susy)
    - global-builtin  # global unit()/nth()/type-of()/… (theme + our skins)
    - color-functions # lighten()/darken()/mix()/… (theme + our skins)


# Outputting
# permalink: /:categories/:title/
timezone: Asia/Seoul # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins (previously gems:)
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-last-modified-at


# Archives
#  Type
#  - GitHub Pages compatible archive pages built with Liquid ~> type: liquid (default)
#  - Jekyll Archives plugin archive pages ~> type: jekyll-archives
#  Path (examples)
#  - Archive page should exist at path when using Liquid method or you can
#    expect broken links (especially with breadcrumbs enabled)
#  - <base_path>/tags/my-awesome-tag/index.html ~> path: /tags/
#  - <base_path>/categories/my-awesome-category/index.html ~> path: /categories/
#  - <base_path>/my-awesome-category/index.html ~> path: /
category_archive:
  type: liquid
  path: /categories/
# tag_archive:
#   type: liquid
#   path: /tags/
# https://github.com/jekyll/jekyll-archives
# jekyll-archives:
#   enabled:
#     - categories
#     - tags
#   layouts:
#     category: archive-taxonomy
#     tag: archive-taxonomy
#   permalinks:
#     category: /categories/:name/
#     tag: /tags/:name/

# 카테고리 목록·순서·표시명·색은 _data/categories.yml 한 곳에서 관리한다.
# (예전엔 순서가 여기(categories-ko_order / categories-en_order), 표시명이
#  _data/category_labels.yml, 색이 _data/hues.yml 로 흩어져 있었다. 셋 다 합쳤다.
#  두 순서 목록이 같아졌고, 빈 카테고리는 이제 자동으로 숨는다.)

github: [metadata]

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: false
      show_date: true
      toc: true
      toc_sticky: true
      comments: true
      share: true
      # NOTE: posts no longer force the generative gradient hero band. The title
      # now renders inline at the top of the content column (see single.html's
      # .page__header--lead) with a category eyebrow + hue dot. The category
      # hue/sat is still computed on <body> (--hero-hue) from _data/categories.yml,
      # so the colour cue stays — just as an accent, not a full banner.
      # (Subject-home / category pages set their own overlay in frontmatter and
      # keep their hero.)

# Footer scripts — jquery + plugins 6종 + _main.js 를 이 순서대로 직접 서빙한다.
# jQuery 가 head_scripts 와 여기서 두 번 로드되는 것은 의도된 구조다
# (Blog_Development/Back_to_Top 글 참고).
footer_scripts:
  - /assets/js/vendor/jquery-min/jquery-3.6.0.min.js
  - /assets/js/plugins/jquery.fitvids.js
  - /assets/js/plugins/jquery.greedy-navigation.js
  - /assets/js/plugins/jquery.magnific-popup.js
  - /assets/js/plugins/jquery.ba-throttle-debounce.js
  - /assets/js/plugins/smooth-scroll.js
  - /assets/js/plugins/gumshoe.js
  - /assets/js/_main.js

# Head scripts
head_scripts:
  - /assets/js/vendor/jquery-min/jquery-3.6.0.min.js
  # katex-macros 는 커스텀 스크립트보다 먼저 — Xref_preview 가 parse 시점에
  # window.KATEX_DELIMITERS 를 읽는다
  - /assets/js/katex-macros.js
  # window.hyphenateLatin 정의만 한다 — 호출은 KaTeX 렌더 뒤 (scripts.html)
  - /assets/js/custom/Latin_hyphens.js
  - /assets/js/custom/Color_scheme.js
  - /assets/js/custom/HiddenTopButton.js
  - /assets/js/custom/Comments.js
  - /assets/js/custom/Citation.js
  - /assets/js/custom/Multilingual.js
  - /assets/js/custom/Recent_overlay.js
  - /assets/js/custom/Terms_overlay.js
  - /assets/js/custom/Xref_preview.js
  - /assets/js/custom/Proof_animate.js
  - /assets/js/custom/Local_graph.js
