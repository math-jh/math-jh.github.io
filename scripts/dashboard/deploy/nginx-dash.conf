# /etc/nginx/sites-enabled/blog 의 4000 서버 블록 안에 들어가는 조각의 사본.
# (nginx 설정 자체는 버전 관리되지 않으므로 재현용으로 여기 남긴다.
#  실제 파일을 고칠 때는 이 사본도 같이 갱신할 것.)
#
# 위치: `location / { proxy_pass http://127.0.0.1:4001; ... }` 바로 앞.
# 의도: Jekyll(4001)을 거치지 않는다 — 대시보드 파일을 Jekyll 이 서빙하게 두면
#       데이터·코드 갱신마다 사이트 rebuild 가 돌기 때문.
# 주의: sub_filter(livereload URL 치환)는 `location /` 안에만 있어 여기로 상속되지
#       않는다. 상속되면 대시보드 JS 가 치환 대상이 될 수 있으니 그대로 둘 것.

location = /dash { return 301 /dash/; }
location /dash/ {
    proxy_pass http://127.0.0.1:8089/;
    proxy_http_version 1.1;
    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
}
